name: cla

# Every pull request needs its authors to have signed the Helocore
# Contributor License Agreement (CLA.md). A bot comments with the link; an
# author signs by replying with the sentence it asks for. Signatures are
# kept in this repository, on the `cla-signatures` branch.
#
# Runs on pull_request_target so it can comment on pull requests from
# forks. It never checks out or runs the pull request's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Contributor License Agreement
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the Helocore CLA and I hereby sign it'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Helocorecorp/bailiwick/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # Helocore's own people and GitHub's bots do not sign.
          allowlist: Phantombyter,helocoremaster,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Helocore CLA and I hereby sign it
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please
            read the [Helocore Contributor License Agreement](https://github.com/Helocorecorp/bailiwick/blob/main/CLA.md)
            and sign it by replying to this pull request with the sentence
            below. You only need to do this once.
          custom-allsigned-prcomment: All contributors have signed the Helocore CLA. Thank you.
          lock-pullrequest-aftermerge: false
