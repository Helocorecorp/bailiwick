# A typical compose file, used by `bailiwick import compose` and the import tests.
name: acme-shop

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro   # bind mount, not a data store

  api:
    image: registry.example.com/acme/api:1.4.2
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 512M
    environment:
      DATABASE_URL: postgres://app:secret@db:5432/shop   # colon inside a scalar
      REDIS_URL: redis://cache:6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  worker:
    image: registry.example.com/acme/api:1.4.2
    command: ["python", "-m", "worker"]
    depends_on:
      - db
      - cache

  db:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s

  cache:
    image: redis:7

volumes:
  pgdata:
