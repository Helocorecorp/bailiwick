[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bailiwick-lang"
version = "0.1.0"
description = "Bailiwick: say what your software needs, not where it runs. Check where each part may legally run, with GDPR, HIPAA, PIPEDA and more built in."
license = { text = "Apache-2.0" }
authors = [{ name = "Phantombyter" }]
requires-python = ">=3.9"
dependencies = ["wasmtime>=20"]
keywords = ["bailiwick", "data-residency", "gdpr", "hipaa", "pipeda", "compliance", "terraform", "kubernetes"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Helocorecorp/bailiwick"

[project.scripts]
bailiwick = "bailiwick.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bailiwick = ["bailiwick.wasm"]
