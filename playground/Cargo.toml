[package]
name = "bailiwick-playground"
version = "0.1.0"
edition = "2021"
description = "The Bailiwick toolchain compiled to WebAssembly, for the browser playground."
authors = ["Phantombyter"]
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
bailiwick = { path = ".." }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
