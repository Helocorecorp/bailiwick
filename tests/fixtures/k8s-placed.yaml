apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    bailiwick: api
spec:
  template:
    spec:
      nodeSelector:
        topology.kubernetes.io/region: eu-central-1
      containers:
        - name: api
          image: registry.example.com/acme/api:1.0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: customers
  labels:
    bailiwick-keys: customer
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: [eu-central-1, us-east-1]
      containers:
        - name: db
          image: postgres:16
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reports
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: r
              image: registry.example.com/acme/reports:1.0
---
apiVersion: v1
kind: Service
metadata:
  name: api
